<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- HITZET 마크: 검은 바탕 위 오렌지 선. 가운데 점(이상치)을 실선 원이 짚고, 바깥 점선 원이 감싼다.
       "분포 밖의 이상치를 먼저 본다"는 뜻. 독자 디자인. -->
  <rect width="64" height="64" rx="14" fill="#0b0b0d"/>
  <circle cx="32" cy="32" r="4.5" fill="#f58025"/>
  <circle cx="32" cy="32" r="13" stroke="#f58025" stroke-width="3"/>
  <circle cx="32" cy="32" r="22" stroke="#ff9d4d" stroke-width="2" stroke-dasharray="3.5 4.5"/>
